[project]
name = "dictation-server"
version = "0.1.0"
description = "On-device MLX dictation server (Parakeet STT + quantized LLM cleanup)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mlx; sys_platform == 'darwin'",
    "mlx-lm; sys_platform == 'darwin'",
    "parakeet-mlx; sys_platform == 'darwin'",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
# Windows/Linux CPU backend: Parakeet v3 int8 via sherpa-onnx (no MLX).
onnx = [
    "sherpa-onnx>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dictation_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that download and run real MLX models (gated by RUN_REAL_MODELS=1)",
]
