[project]
name = "dictation-server"
version = "0.1.0"
description = "On-device MLX dictation server (Parakeet STT + quantized LLM cleanup)"
requires-python = ">=3.12"
dependencies = [
    "mlx",
    "mlx-lm",
    "parakeet-mlx",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "PyYAML",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dictation_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that download and run real MLX models (gated by RUN_REAL_MODELS=1)",
]
