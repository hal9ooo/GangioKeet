  elle ics ci: LXC
  emme elle ics: MLX
  emme q ti ti: MQTT
  z f s: ZFS
  zeta effe esse: ZFS
  q device: QDevice
  acca a: HA
  acca ti ti pi: HTTP
  v elle a en: VLAN
  fast a pi: FastAPI
  prossimo ve: Proxmox VE
  lama punto ci pi pi: llama.cpp
  # Nomi tecnici dettati: forme che non esistono in italiano, sicure da riscrivere sempre.
  ci per inference: Cheaper Inference
  cip per inference: Cheaper Inference
  cyper inference: Cheaper Inference
  ciper inference: Cheaper Inference
  cyber inference: Cheaper Inference
  cheaperinference: Cheaper Inference
  cheaper inference: Cheaper Inference
  codecx: Codex
  dipsig: DeepSeek
  dipsik: DeepSeek
  deepsick: DeepSeek
  deepsik: DeepSeek
  omni router: OmniRoute
  omni root: OmniRoute
  omnirouter: OmniRoute
  omniroot: OmniRoute
  open router: OpenRouter
  open code: OpenCode
  antigraviti: Antigravity
  # "il feeling del Comando" è Command Code: l'ASR sente l'inglese "Command" come "Comando".
  feeling del comando: feeling del Command Code
  il comando code: il Command Code
  command code: Command Code

contextual_corrections:
  # Solo con la guardia giusta: un falso positivo costa più di una correzione mancata.
  # "lancio agenti di psic", "esce psic 1217" ma MAI "lo psicologo".
  - from: psic
    to: DeepSeek
    context: '\b(?:di|da|su|con|per)\s+(?:word)\b|\b(?:word)\s+\d{2,4}\b'
  # "in Cloud Code o Codex o Antigraviti" (elenco di agenti), non "cloud code" generico.
  - from: cloud code
    to: Claude Code
    context: '(?:word)\s+(?:o|e)\s+(?:Codex|Antigravity|OpenCode)\b'
  # "i piani con Codecs, poi cloud".
  - from: codecs
    to: Codex
    context: '\b(?:con|da|a)\s+(?:word)\b(?=\s*(?:,|poi)\b)'
  # Il CT123 si chiama così.
  - from: open cloud
    to: OpenClaw
    context: '\bsi\s+chiama\s+(?:word)\b|(?:word)\s*,\s*su\s+ct'
  # "con Cloud, con Codex": agente. "tutto cloud", "cloud storage": resta cloud.
  - from: cloud
    to: Claude
    context: '\b(?:con|su|e|da)\s+(?:word)\b(?![^.]{0,14}\b(?:code|storage|native|computing|provider|gpu|cpu|hosting|backup)\b)'

elision_corrections:
  - from: con la gente
    to: con l'agente
  - from: nella gente
    to: nell'agente
  - from: della gente
    to: dell'agente
  - from: dalla gente
    to: dall'agente
  - from: sulla gente
    to: sull'agente
  - from: alla gente
    to: all'agente
  - from: per la gente
    to: per l'agente
  - from: la gente
    to: l'agente
    keep_when_preceded_by: [molta, moltissima, tanta, tantissima, poca, pochissima, altra, qualche, numerosa, "un sacco di", "un mucchio di", "quando dico", "dico molto spesso"]
    keep_when_followed_by: [comune, "del posto", "che passa", intera]