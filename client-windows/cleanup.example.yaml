- CodeIgniter 4
- PostgreSQL
- MariaDB
- Home Assistant
- ESPHome
- Tasmota
- Tailscale
- MikroTik
- RouterOS
- Authelia
- Nginx Proxy Manager
- MLX
- Parakeet
- llama.cpp
- OpenCode
- Cursor
- WebSocket
- GitHub
- Docker
phonetic_overrides:
  elle ics ci: LXC
  emme elle ics: MLX
  emme q ti ti: MQTT
  z f s: ZFS
  zeta effe esse: ZFS
  q device: QDevice
  acca a: HA
  acca ti ti pi: HTTP
  v elle a en: VLAN
  fast a pi: FastAPI
  prossimo ve: Proxmox VE
  lama punto ci pi pi: llama.cpp
  superpowers: superpowers

elision_corrections:
  - from: con la gente
    to: con l'agente
  - from: nella gente
    to: nell'agente
  - from: della gente
    to: dell'agente
  - from: dalla gente
    to: dall'agente
  - from: sulla gente
    to: sull'agente
  - from: alla gente
    to: all'agente
  - from: per la gente
    to: per l'agente
  - from: la gente
    to: l'agente
    keep_when_preceded_by: [molta, moltissima, tanta, tantissima, poca, pochissima, altra, qualche, numerosa, "un sacco di", "un mucchio di"]
    keep_when_followed_by: [comune, "del posto", "che passa", intera]
