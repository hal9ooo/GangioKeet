# GangioKeet client configuration example.
# Copy this file to %APPDATA%/GangioKeet/client_config.yaml, then edit.
# Strict schema: unknown keys are rejected. Times are seconds (doubles), ms are integers.
# Legacy keys from the old remote setup (server, endpoints, inference.mode) are
# ignored in memory and never rewritten by the app.
inference:
  model_selection_path: "models/selected.json" # relative to installed app directory
  cleanup_policy_path: "cleanup.yaml"         # policy locale di pulizia
  backend: vulkan                    # vulkan | cpu

recording:
  enabled: false                     # only completed dictations, not ambient recording
  directory: "recordings"            # relative to the per-user GangioKeet data directory
  store_context: false               # never stores selected text

hotkey:
  mode: "push_to_talk"                # push_to_talk | toggle
  key: "capslock"                     # capslock, f1..f24, mouse_x1 (alt_r escluso: conflitto AltGr)
  abort_key: "escape"                 # f1..f24, mouse_x1, escape
  double_tap_max_ms: 250              # durata massima di un tap perché conti come tap
  double_tap_gap_ms: 350              # intervallo massimo tra i due tap del double-tap

audio:
  input_device: null                  # null per il microfono predefinito di Windows
  sample_rate: 16000                  # PCM16 LE mono
  channels: 1
  chunk_duration_ms: 100
  ready_timeout_seconds: 3.0          # quanto aspettare che il mic sia pronto prima di registrare

paste:
  default_combo: "ctrl+v"
  terminal_combo: "ctrl+shift+v"      # guardrail 3.4
  terminal_apps: ["wt.exe", "windowsterminal.exe", "powershell.exe",
                  "pwsh.exe", "cmd.exe", "conhost.exe", "mintty.exe"]
  clipboard_restore_delay_ms: 200     # guardrail 3.4
  refocus_before_paste: true          # focus cambiato -> ripristina la finestra target originaria

ui:
  show_floating_pill: true
  pill_position: "center_bottom"             # cursor | center_bottom
  sound_feedback: true

context_profiles:
  code:
    - "code.exe"
    - "devenv.exe"
    - "cursor.exe"
    - "pycharm64.exe"
  terminal:
    - "windowsterminal.exe"
    - "wt.exe"
    - "cmd.exe"
    - "powershell.exe"
  chat:
    - "slack.exe"
    - "teams.exe"
    - "discord.exe"
    - "telegram.exe"
  email:
    - "outlook.exe"
    - "thunderbird.exe"
  document:
    - "winword.exe"
    - "obsidian.exe"
    - "notion.exe"

browser_profiles:                     # guardrail 3.5
  browsers: ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe"]
  rules:                              # priorità di match: email, chat, code, document
    email: ["Gmail", "Outlook", "Proton Mail"]
    chat: ["WhatsApp", "Telegram", "Slack", "Discord", "Teams"]
    code: ["GitHub", "GitLab", "Stack Overflow"]
    document: ["Google Docs", "Notion", "Overleaf"]

recovery:
  retention_seconds: 600              # quanto resta recuperabile l'ultimo fallimento
