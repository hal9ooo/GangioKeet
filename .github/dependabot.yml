version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # datasets 5 requires torchcodec; the eval venv stays on 3.6.0.
    ignore:
      - dependency-name: "datasets"

  - package-ecosystem: "nuget"
    directory: "/client-windows/src/GangioKeet.Client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
